name: PHP and Yii2 CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yii2-native-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PHP ${{ matrix.php }} / Yii2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        php: ["8.2", "8.3", "8.4", "8.5"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Validate composer.json and composer.lock
        run: composer validate --strict

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Verify Yii2 dependency
        run: composer show yiisoft/yii2

      - name: Check PHP syntax
        shell: bash
        run: |
          find src tests -type f -name '*.php' -print0 |
            xargs -0 -r -n1 php -l

      - name: Run PHPUnit
        run: vendor/bin/phpunit

      - name: Build Codeception
        run: vendor/bin/codecept build

      - name: Run Codeception tests
        run: vendor/bin/codecept run --no-interaction

  javascript:
    name: JavaScript client
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
         persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check syntax
        run: |
          node --check resources/js/native.js
          node --check resources/preview/preview.js
      - name: Install dev dependencies
        run: npm install --no-audit --no-fund
      - name: Run JavaScript tests
        run: npm test
