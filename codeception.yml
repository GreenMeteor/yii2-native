namespace: greenmeteor\native\tests
support_namespace: Support
paths:
  tests: tests
  output: tests/_output
  data: tests/Support/Data
  support: tests/Support
actor_suffix: Tester
bootstrap: bootstrap.php
settings:
  colors: true
  memory_limit: 1024M
suites:
  unit:
    path: unit
    actor: UnitTester
    modules:
      enabled:
        - Asserts
